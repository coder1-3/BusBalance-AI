
{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2>New User Registration</h2>
    <form method="POST" action="/register">
        <div class="form-group"><label>Full Legal Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <div class="form-group">
            <label>Role</label>
            <select name="role">
                <option value="passenger">Public / Passenger</option>
                <option value="staff">Transit Employee</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Submit Registration</button>
    </form>
</div>
{% endblock %}

{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 4rem auto; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
    <h2 style="margin-bottom: 1.5rem; color: var(--brand-navy);">Create Account</h2>
    <form method="POST" action="/register">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Account Type</label>
            <select name="role">
                <option value="passenger">Passenger / Commuter</option>
                <option value="staff">Transit Employee</option>
            </select>
        </div>

        <!-- Math CAPTCHA Field -->
        <div class="form-group">
            <label>Security Check:<br><br> What is {{ captcha_question }}</label>
            <input type="number" name="captcha" required autocomplete="off" placeholder="Enter the sum">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>
</div>
{% endblock %}

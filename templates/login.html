
{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--brand-navy);">Sign In</h2>
    <form method="POST" action="/login">
        <label>Username</label><input type="text" name="username" required>
        <br>
        <label>Password</label><input type="password" name="password" required>
        <br><br>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
    </form>
</div>
{% endblock %}

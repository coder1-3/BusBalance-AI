
{% extends "layout.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="width: 100%; max-width: 450px;">
        <h2 style="text-align: center;">Sign In to Your Account</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Access schedules and manage your bookings.</p>
        
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.2rem; margin-top: 1rem;">Sign In</button>
        </form>
        
        <div style="margin-top: 2rem; background: #f8f9fa; padding: 1rem; border-radius: 6px; font-size: 0.95rem;">
            <strong>Demo Accounts:</strong><br>
            Staff: <code>admin</code> / <code>admin123</code><br>
            Passenger: <code>user</code> / <code>user123</code><br>
            <h2>Don't have account?<br><a href="register.html">Register</a></h2>
        </div>
    </div>
</div>
{% endblock %}

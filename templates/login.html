
{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h2>Welcome Back!</h2>
    <form method="POST" action="/login" style="margin-top: 20px;">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 15px; font-size: 0.9em;">Use <b>staff1/pass</b> for Staff, <b>pass1/pass</b> for Passenger.</p>
</div>
{% endblock %}

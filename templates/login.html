{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--brand-navy);">Sign In</h2>
    <form method="POST" action="/login">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        
        <!-- Math CAPTCHA Field -->
        <div class="form-group">
            <label>Security Check:<br><br> What is {{ captcha_question }}</label>
            <input type="number" name="captcha" required autocomplete="off" placeholder="Enter the sum">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
</div>
{% endblock %}


{% extends "layout.html" %}
{% block content %}
<h2>Select a Route</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
    {% for s in schedules %}
    <div class="card">
        <h3 style="color: var(--primary); margin-top:0;">{{ s.route_name }}</h3>
        <p><strong>Time:</strong> {{ s.departure_time }}</p>
        <p><strong>Capacity Status:</strong> {{ s.booked_seats }} / {{ s.capacity }} Booked</p>
        <div style="margin-top: 15px;">
            <a href="/passenger/select_seat/{{ s.id }}" class="btn btn-primary" style="width:100%; box-sizing:border-box;">Proceed to Seat Selection</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

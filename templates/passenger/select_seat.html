
{% extends "layout.html" %}
{% block content %}
<h2 style="color: var(--brand-navy); margin-bottom: 2rem;">Select {{ passenger_count }} Seat(s)</h2>

<form method="POST" action="/passenger/checkout">
    <input type="hidden" name="schedule_id" value="{{ schedule.id }}">
    <input type="hidden" name="passenger_count" value="{{ passenger_count }}">
    
    <div style="display: flex; gap: 3rem;">
        <div class="card" style="width: 340px; margin: 0 auto; border-radius: 40px 40px 12px 12px; padding: 2rem; border-top: 8px solid var(--border-soft);">
            <div class="seat-grid">
                {% for i in range(1, schedule.capacity + 1) %}
                    {% if i in booked_seats %}
                        <div class="seat-booked">{{ i }}</div>
                    {% else %}
                        <label class="seat-label">
                            <input type="checkbox" name="seat_number" value="{{ i }}" class="seat-checkbox">
                            <span>{{ i }}</span>
                        </label>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
        
        <div class="card" style="width: 300px; height: fit-content; position: sticky; top: 2rem;">
            <h3>Summary</h3>
            <p style="margin-top: 1rem; color: var(--text-muted);">Select exactly <b style="color: var(--brand-navy);">{{ passenger_count }}</b> seat(s).</p>
            <button type="submit" class="btn btn-primary" id="checkoutBtn" style="width: 100%; margin-top: 2rem;" disabled>Proceed to Payment</button>
        </div>
    </div>
</form>

<script>
    const maxSeats = parseInt("{{ passenger_count }}");
    const checkboxes = document.querySelectorAll('.seat-checkbox');
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    checkboxes.forEach(cb => {
        cb.addEventListener('change', () => {
            const checkedCount = document.querySelectorAll('.seat-checkbox:checked').length;
            if (checkedCount > maxSeats) {
                cb.checked = false;
                alert(`Your search was for ${maxSeats} passenger(s).`);
            }
            checkoutBtn.disabled = document.querySelectorAll('.seat-checkbox:checked').length !== maxSeats;
        });
    });
</script>
{% endblock %}

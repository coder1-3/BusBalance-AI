
{% extends "layout.html" %}
{% block content %}
<div style="display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 500px; padding: 3rem;">
        <h2 style="margin-bottom: 2rem; color: var(--brand-navy); text-align: center;">Secure Checkout</h2>
        
        <div style="border: 1px solid var(--border-soft); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="color: var(--text-muted);">Route</span>
                <span style="font-weight: 600;">{{ booking.route_name }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="color: var(--text-muted);">Seats ({{ num_seats }})</span>
                <span style="font-weight: 600;">{{ formatted_seats }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border-soft);">
                <span style="color: var(--text-muted); font-weight: 600;">Total Amount</span>
                <span style="font-weight: 800; color: var(--brand-blue); font-size: 1.2rem;">${{ "%.2f"|format(booking.total_cost) }}</span>
            </div>
        </div>
        
        <form method="POST" action="/passenger/payment/{{ booking.id }}">
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;">Pay ${{ "%.2f"|format(booking.total_cost) }}</button>
        </form>
    </div>
</div>
{% endblock %}

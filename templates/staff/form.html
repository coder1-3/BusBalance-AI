
{% extends "layout.html" %}
{% block content %}
<h2>{{ action }} Transit Schedule</h2>
<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>Route Designation</label>
            <input type="text" name="route_name" value="{{ schedule.route_name if schedule else '' }}" required>
        </div>
        <div class="form-group">
            <label>Departure Time</label>
            <input type="text" name="departure_time" value="{{ schedule.departure_time if schedule else '' }}" required>
        </div>
        <div class="form-group">
            <label>Vehicle Capacity (Total Seats)</label>
            <input type="number" name="capacity" value="{{ schedule.capacity if schedule else '' }}" required>
        </div>
        <div class="form-group">
            <label>Assigned Driver</label>
            <input type="text" name="driver_name" value="{{ schedule.driver_name if schedule else '' }}" required>
        </div>
        <div class="form-group">
            <label>Assigned Conductor</label>
            <input type="text" name="conductor_name" value="{{ schedule.conductor_name if schedule else '' }}" required>
        </div>
        
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">{{ action }} Schedule</button>
            <a href="/staff/dashboard" class="btn btn-outline" style="margin-left: 10px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
